<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Circle Imposter</title>
<style>
body {
  background:#0d0d0d;
  color:white;
  font-family:Arial;
  text-align:center;
}
#circleWrap {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:15px;
  max-width:350px;
  margin:30px auto;
}
.circle {
  border:2px solid white;
  border-radius:50%;
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  cursor:pointer;
}
.hidden { display:none; }
#card {
  font-size:26px;
  margin-top:30px;
}
button {
  padding:12px 18px;
  font-size:16px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>🎭 Circle Imposter</h1>

<div id="circleWrap"></div>

<div id="reveal" class="hidden">
  <div id="card"></div>
  <button onclick="closeCard()">Done / Pass Phone</button>
</div>

<script>
const players = ["Ben","Carly","Russ","Lexi","Deb","Paul","Lori","Zach"];
const impostersCount = 1;

const categories = {
  "People": ["Ryan Fisher","Carly Schreiber","Lexi Schreiber"],
  "Places": ["Centennial","Vanderbilt","Burger King"],
  "Schreiberbaum": ["Miso-happy","Nugget","Bina"],
  "Objects": ["Sea Bob","Dyson"]
};

let chosenCategory = Object.keys(categories)[Math.floor(Math.random()*4)];
let chosenWord = categories[chosenCategory][Math.floor(Math.random()*categories[chosenCategory].length)];
let imposters = [];
while(imposters.length < impostersCount){
  let r = Math.floor(Math.random()*players.length);
  if(!imposters.includes(r)) imposters.push(r);
}

const wrap = document.getElementById("circleWrap");
players.forEach((name,i)=>{
  let div = document.createElement("div");
  div.className="circle";
  div.innerText=name;
  div.onclick = ()=>reveal(i);
  wrap.appendChild(div);
});

function reveal(i){
  document.getElementById("circleWrap").classList.add("hidden");
  document.getElementById("reveal").classList.remove("hidden");
  document.getElementById("card").innerText =
    imposters.includes(i)
    ? "😈 IMPOSTER\nCategory: " + chosenCategory
    : "Your word:\n" + chosenWord;
}

function closeCard(){
  document.getElementById("reveal").classList.add("hidden");
  document.getElementById("circleWrap").classList.remove("hidden");
}
</script>

</body>
</html>
