<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Circle Imposter</title>
<style>
body {
  background:#0d0d0d;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1 { margin-top:20px; }
#lobby, #circleWrap, #reveal { margin-top:20px; }
#circleWrap {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:15px;
  max-width:350px;
  margin:30px auto;
}
.circle {
  border:2px solid white;
  border-radius:50%;
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  cursor:pointer;
}
.hidden { display:none; }
#card {
  font-size:26px;
  margin-top:30px;
}
button {
  padding:12px 18px;
  font-size:16px;
  margin-top:20px;
}
.checkbox-list {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  max-width:400px;
  margin:auto;
}
.checkbox-list label {
  background:#222;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🎭 Circle Imposter</h1>

<!-- Lobby -->
<div id="lobby">
  <h2>Select Players</h2>
  <div class="checkbox-list" id="playerCheckboxes"></div>

  <h2>Select Number of Imposters</h2>
  <select id="impCountSelect">
    <option value="1" selected>1</option>
    <option value="2">2</option>
    <option value="3">3</option>
  </select>
  <br>
  <button onclick="startGame()">Start Game</button>
</div>

<!-- Circle view -->
<div id="circleWrap" class="hidden"></div>

<!-- Reveal card -->
<div id="reveal" class="hidden">
  <div id="card"></div>
  <button onclick="closeCard()">Done / Pass Phone</button>
</div>

<script>
// Possible players
const allPlayers = ["Ben","Carly","Russ","Lexi","Deb","Paul","Lori","Zach"];

// Word categories (example, you can expand)
const categories = {
  "People": ["Ryan Fisher","Carly Schreiber","Lexi Schreiber"],
  "Places": ["Centennial","Vanderbilt","Burger King"],
  "Schreiberbaum": ["Miso-happy","Nugget","Bina"],
  "Objects": ["Sea Bob","Dyson"]
};

let chosenPlayers = [];
let imposters = [];
let chosenCategory = "";
let chosenWord = "";

// Build lobby checkboxes
const playerCheckboxes = document.getElementById("playerCheckboxes");
allPlayers.forEach(name => {
  const label = document.createElement("label");
  label.innerHTML = `<input type="checkbox" value="${name}" checked> ${name}`;
  playerCheckboxes.appendChild(label);
});

// Start the game
function startGame(){
  chosenPlayers = Array.from(document.querySelectorAll("#playerCheckboxes input:checked")).map(c => c.value);
  if(chosenPlayers.length < 3){
    alert("Select at least 3 players!");
    return;
  }

  // Select number of imposters
  const impCount = Number(document.getElementById("impCountSelect").value);
  if(impCount >= chosenPlayers.length){
    alert("Too many imposters for selected players!");
    return;
  }

  // Randomly assign imposters
  imposters = [];
  while(imposters.length < impCount){
    let r = Math.floor(Math.random()*chosenPlayers.length);
    if(!imposters.includes(r)) imposters.push(r);
  }

  // Pick random category and word
  const categoryKeys = Object.keys(categories);
  chosenCategory = categoryKeys[Math.floor(Math.random()*categoryKeys.length)];
  const words = categories[chosenCategory];
  chosenWord = words[Math.floor(Math.random()*words.length)];

  // Hide lobby, show circles
  document.getElementById("lobby").classList.add("hidden");
  buildCircles();
}

// Build player circles
function buildCircles(){
  const wrap = document.getElementById("circleWrap");
  wrap.innerHTML = "";
  chosenPlayers.forEach((name,i) => {
    let div = document.createElement("div");
    div.className="circle";
    div.innerText=name;
    div.onclick = ()=>reveal(i);
    wrap.appendChild(div);
  });
  wrap.classList.remove("hidden");
}

// Reveal role / word
function reveal(i){
  document.getElementById("circleWrap").classList.add("hidden");
  document.getElementById("reveal").classList.remove("hidden");
  document.getElementById("card").innerText =
    imposters.includes(i)
    ? "😈 IMPOSTER\nCategory: " + chosenCategory
    : "Your word:\n" + chosenWord;
}

// Close card and pass phone
function closeCard(){
  document.getElementById("reveal").classList.add("hidden");
  document.getElementById("circleWrap").classList.remove("hidden");
}
</script>

</body>
</html>
